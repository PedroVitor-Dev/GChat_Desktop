# Publica a landing page (pasta site/) no GitHub Pages a cada push na main.
# Requer: Settings → Pages → Source = "GitHub Actions".
name: Landing page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # O GitHub às vezes responde "Deployment failed, try again later" ou não
      # encontra o artefato recém-enviado na primeira tentativa (e passa ao
      # reexecutar). Então: tenta, espera um pouco e tenta de novo sozinho.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Aguardar antes de tentar de novo
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
