appId: com.pedrovitor.gchatdesktopplus
productName: GChat Desktop+
copyright: Copyright © 2026 Pedro Vitor
directories:
  output: release/${version}
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
# Ícone de janela/notificação lido em tempo de execução (fora do asar).
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/sounds
    to: sounds
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: GChat-Desktop-Plus-Setup-${version}-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: GChat Desktop+
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  # Visual do instalador (gerado por `npm run installer-art`)
  installerSidebar: resources/installer/sidebar.bmp
  uninstallerSidebar: resources/installer/sidebar.bmp
  installerHeader: resources/installer/header.bmp
  # Instalador em português do Brasil
  installerLanguages: [pt_BR]
  language: '1046'
  multiLanguageInstaller: false
  # Licença exibida antes da instalação
  license: ../../LICENSE
  runAfterFinish: true
  menuCategory: false
  # Configurações e sons importados ficam em %APPDATA% e sobrevivem a atualizações.
  deleteAppDataOnUninstall: false
# Atualização automática: o electron-updater lê os Releases do GitHub (latest.yml).
# O upload é feito pelo workflow de release; o build local nunca publica (--publish never).
publish:
  provider: github
  owner: PedroVitor-Dev
  repo: GChat_Desktop
  releaseType: release

# ── Microsoft Store (MSIX/AppX) ─────────────────────────────────────────────
# Gerar: npm run dist:store -w @gchat/desktop  (→ release/<versão>/*.appx)
# Logos e blocos: resources/appx (gerados por `npm run appx-assets`).
# A Store assina o pacote; não é preciso certificado para enviar.
appx:
  # ⚠️ PREENCHER com o Partner Center → seu app → Gerenciamento do produto →
  # Identidade do produto. Enquanto estiverem com estes valores provisórios, o
  # pacote serve só para teste local e a Store recusa o envio.
  identityName: PROVISORIO.GChatDesktopPlus # Package/Identity/Name
  publisher: CN=PROVISORIO # Package/Identity/Publisher
  publisherDisplayName: PedroVitor-Dev # Package/Properties/PublisherDisplayName
  applicationId: GChatDesktopPlus
  displayName: GChat Desktop+
  backgroundColor: '#1e1f22'
  languages: [pt-BR]
  showNameOnTiles: true
  artifactName: GChat-Desktop-Plus-${version}-x64-store.${ext}
  # Windows 10 1809+ (mínimo do Electron atual); testado com o SDK 10.0.26100.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
